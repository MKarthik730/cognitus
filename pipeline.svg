<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,1 L0,6 L7,3.5 z" fill="#30363d"/>
    </marker>
  </defs>

  <rect width="960" height="230" fill="url(#bg2)" rx="12"/>
  <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.4"/>
  </pattern>
  <rect width="960" height="230" fill="url(#grid2)" rx="12" opacity="0.5"/>

  <!-- Column headers -->
  <text x="82" y="28" text-anchor="middle" font-size="9" fill="#8b949e" letter-spacing="1" font-family="monospace">STEP</text>
  <text x="340" y="28" text-anchor="middle" font-size="9" fill="#3fb950" letter-spacing="1" font-family="monospace">STANDARD MODE</text>
  <text x="720" y="28" text-anchor="middle" font-size="9" fill="#f0883e" letter-spacing="1" font-family="monospace">CASE STUDY MODE</text>
  <line x1="16" y1="34" x2="944" y2="34" stroke="#21262d" stroke-width="1"/>

  <!-- Row 0 -->
  <rect x="16" y="42" width="132" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="82" y="64" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">Step 0</text>
  <rect x="164" y="42" width="352" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
  <text x="340" y="60" text-anchor="middle" font-size="9.5" fill="#6e7681">—</text>
  <rect x="532" y="42" width="412" height="36" rx="6" fill="#f0883e" opacity="0.07" stroke="#f0883e" stroke-width="0.8"/>
  <text x="738" y="60" text-anchor="middle" font-size="9.5" fill="#f0883e">Upload &amp; extract files (PDF / Image / DOCX / TXT)</text>

  <!-- Row 1 -->
  <rect x="16" y="84" width="132" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="82" y="106" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">Step 1</text>
  <rect x="164" y="84" width="352" height="36" rx="6" fill="#3fb950" opacity="0.07" stroke="#3fb950" stroke-width="0.8"/>
  <text x="340" y="102" text-anchor="middle" font-size="9.5" fill="#3fb950">Node Selector picks 3–5 experts dynamically</text>
  <rect x="532" y="84" width="412" height="36" rx="6" fill="#e3b341" opacity="0.07" stroke="#e3b341" stroke-width="0.8"/>
  <text x="738" y="102" text-anchor="middle" font-size="9.5" fill="#e3b341">User defines 2–6 custom expert nodes with behaviors</text>

  <!-- Row 2 -->
  <rect x="16" y="126" width="132" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="82" y="148" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">Step 2</text>
  <rect x="164" y="126" width="352" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
  <text x="340" y="144" text-anchor="middle" font-size="9.5" fill="#6e7681">—</text>
  <rect x="532" y="126" width="412" height="36" rx="6" fill="#f0883e" opacity="0.07" stroke="#f0883e" stroke-width="0.8"/>
  <text x="738" y="144" text-anchor="middle" font-size="9.5" fill="#f0883e">Context pipeline summarizes files if over token limit</text>

  <!-- Row 3 -->
  <rect x="16" y="168" width="132" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="82" y="190" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">Steps 3–5</text>
  <rect x="164" y="168" width="780" height="36" rx="6" fill="#a371f7" opacity="0.07" stroke="#a371f7" stroke-width="0.8"/>
  <text x="554" y="186" text-anchor="middle" font-size="9.5" fill="#a371f7">All experts analyze in parallel  →  Cross-Check finds contradictions  →  Synthesizer produces unified verdict</text>
</svg>
<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cognitus architecture</title>
  <desc>System architecture showing Frontend, FastAPI Backend with LangGraph and Agent Pipeline, PostgreSQL, and Redis</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer platform container -->
  <rect x="20" y="20" width="640" height="480" rx="16" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text x="340" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#5F5E5A">Cognitus platform</text>

  <!-- Frontend box -->
  <rect x="44" y="64" width="148" height="200" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="118" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">Frontend</text>
  <line x1="68" y1="96" x2="168" y2="96" stroke="#534AB7" stroke-width="0.5" opacity="0.4"/>
  <text x="118" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Canvas graph</text>
  <text x="118" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Verdict panel</text>
  <text x="118" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Node builder</text>
  <text x="118" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Follow-up chat</text>
  <text x="118" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Export panel</text>
  <text x="118" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Settings</text>
  <text x="118" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7F77DD">Vanilla JS + Canvas + Vite</text>

  <!-- Backend outer box -->
  <rect x="240" y="64" width="396" height="380" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="438" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">FastAPI backend</text>
  <line x1="260" y1="96" x2="616" y2="96" stroke="#0F6E56" stroke-width="0.5" opacity="0.4"/>

  <!-- LangGraph box inside backend -->
  <rect x="258" y="108" width="360" height="64" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="438" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">LangGraph state machine</text>
  <text x="438" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">CouncilState TypedDict · parallel node execution</text>

  <!-- Agent Pipeline box inside backend -->
  <rect x="258" y="196" width="360" height="160" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="438" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Agent pipeline</text>
  <line x1="278" y1="226" x2="598" y2="226" stroke="#0F6E56" stroke-width="0.5" opacity="0.4"/>

  <!-- Agent pipeline stages -->
  <rect x="278" y="236" width="76" height="32" rx="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="316" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#04342C">Distributor</text>

  <rect x="370" y="236" width="76" height="32" rx="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="408" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#04342C">Experts ‖</text>

  <rect x="462" y="236" width="84" height="32" rx="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="504" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#04342C">Cross-examine</text>

  <rect x="278" y="286" width="268" height="32" rx="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="412" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#04342C">Synthesizer — forced commitment</text>

  <line x1="354" y1="252" x2="370" y2="252" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="446" y1="252" x2="462" y2="252" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="504" y1="268" x2="504" y2="278" stroke="#0F6E56" stroke-width="1"/>
  <line x1="412" y1="278" x2="412" y2="286" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- LLM provider box inside backend -->
  <rect x="258" y="376" width="360" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="438" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">LLM provider (pluggable)</text>
  <text x="438" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">HuggingFace · Groq · Anthropic · OpenRouter · Ollama</text>

  <!-- Arrow LangGraph → Agent -->
  <line x1="438" y1="172" x2="438" y2="196" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Arrow Agent → LLM -->
  <line x1="438" y1="356" x2="438" y2="376" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- DB and Cache boxes below frontend -->
  <rect x="44" y="296" width="148" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="118" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">PostgreSQL 16</text>
  <text x="118" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">+ pgvector · asyncpg</text>

  <rect x="44" y="376" width="148" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="118" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">Redis 7</text>
  <text x="118" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">Cache · WS events · TTL</text>

  <!-- WebSocket / SSE arrow (Frontend ↔ Backend) -->
  <line x1="192" y1="120" x2="240" y2="120" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="240" y1="134" x2="192" y2="134" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="216" y="114" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">WebSocket / SSE</text>

  <!-- HTTP REST arrow -->
  <line x1="192" y1="172" x2="240" y2="172" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="240" y1="186" x2="192" y2="186" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="216" y="166" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">HTTP REST</text>

  <!-- DB ↔ Backend -->
  <line x1="192" y1="318" x2="240" y2="318" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="240" y1="330" x2="192" y2="330" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Redis ↔ Backend -->
  <line x1="192" y1="398" x2="240" y2="398" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="240" y1="410" x2="192" y2="410" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="44" y1="470" x2="64" y2="470" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="70" y="474" font-family="sans-serif" font-size="11" fill="#5F5E5A">UI ↔ API</text>
  <line x1="140" y1="470" x2="160" y2="470" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="166" y="474" font-family="sans-serif" font-size="11" fill="#5F5E5A">Infra ↔ API</text>
  <line x1="244" y1="470" x2="264" y2="470" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="270" y="474" font-family="sans-serif" font-size="11" fill="#5F5E5A">Internal pipeline</text>
</svg>

<svg width="100%" viewBox="0 0 680 660" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cognitus pipeline</title>
  <desc>Analysis pipeline from input through Distributor, parallel Expert Nodes, Cross-Examine, Synthesizer to Output</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <rect x="264" y="20" width="152" height="44" rx="22" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="47" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Input / question</text>

  <!-- Arrow: Input → Distributor -->
  <line x1="340" y1="64" x2="340" y2="88" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- DISTRIBUTOR -->
  <rect x="220" y="88" width="240" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">Distributor</text>
  <text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#534AB7">Decomposes into 3–5 sub-questions</text>

  <!-- Fan out lines to 3 expert nodes -->
  <!-- Centre vertical drop then fan -->
  <line x1="340" y1="144" x2="340" y2="168" stroke="#534AB7" stroke-width="1"/>
  <line x1="148" y1="168" x2="532" y2="168" stroke="#534AB7" stroke-width="1"/>
  <line x1="148" y1="168" x2="148" y2="192" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="168" x2="340" y2="192" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="532" y1="168" x2="532" y2="192" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- EXPERT NODE A -->
  <rect x="60" y="192" width="176" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="148" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">Expert node A</text>
  <text x="148" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">Sub-question + case context</text>
  <text x="148" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D85A30">NodeOutput JSON · RAG chunks</text>

  <!-- EXPERT NODE B -->
  <rect x="252" y="192" width="176" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">Expert node B</text>
  <text x="340" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">Sub-question + case context</text>
  <text x="340" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D85A30">NodeOutput JSON · RAG chunks</text>

  <!-- EXPERT NODE C -->
  <rect x="444" y="192" width="176" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="532" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">Expert node C</text>
  <text x="532" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">Sub-question + case context</text>
  <text x="532" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D85A30">NodeOutput JSON · RAG chunks</text>

  <!-- Parallel badge -->
  <rect x="296" y="278" width="88" height="22" rx="11" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">runs in parallel</text>

  <!-- Fan-in lines from expert nodes -->
  <line x1="148" y1="256" x2="148" y2="310" stroke="#993C1D" stroke-width="1"/>
  <line x1="340" y1="256" x2="340" y2="310" stroke="#993C1D" stroke-width="1"/>
  <line x1="532" y1="256" x2="532" y2="310" stroke="#993C1D" stroke-width="1"/>
  <line x1="148" y1="310" x2="532" y2="310" stroke="#993C1D" stroke-width="1"/>
  <line x1="340" y1="310" x2="340" y2="328" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CROSS-EXAMINE -->
  <rect x="200" y="328" width="280" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Cross-examine</text>
  <text x="340" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">Each node: maintain or revise position</text>
  <text x="340" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">Agreement / disagreement scored</text>

  <!-- Arrow Cross-examine → Synthesizer -->
  <line x1="340" y1="396" x2="340" y2="424" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SYNTHESIZER -->
  <rect x="200" y="424" width="280" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">Synthesizer</text>
  <text x="340" y="466" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#534AB7">Forced commitment — one primary verdict</text>
  <text x="340" y="482" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#534AB7">No hedging · consensus meter</text>

  <!-- Arrow Synthesizer → Output -->
  <line x1="340" y1="492" x2="340" y2="520" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <rect x="160" y="520" width="360" height="104" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="546" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Output</text>
  <line x1="180" y1="554" x2="500" y2="554" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
  <text x="340" y="572" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">Verdict card · confidence pill · consensus meter</text>
  <text x="340" y="590" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">Per-node output cards · cross-examine results</text>
  <text x="340" y="608" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">Export (PDF / JSON / share link) · follow-up chat</text>

  <!-- Side labels -->
  <text x="32" y="200" font-family="sans-serif" font-size="10" fill="#993C1D" text-anchor="middle">‖ parallel</text>

  <!-- Cache hit bypass (dashed, right side) -->
  <path d="M620 240 Q650 240 650 340 Q650 432 550 440" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="656" y="236" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="start">cache</text>
  <text x="656" y="248" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="start">hit ⚡</text>
</svg>

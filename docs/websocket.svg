<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrLamber" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrLblue" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrLpurple" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="860" height="360" rx="14" fill="url(#bg)"/>
  <rect width="860" height="360" rx="14" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <text x="430" y="32" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="500" letter-spacing="3">COGNITUS · WEBSOCKET EVENT SEQUENCE</text>

  <!-- Lifeline labels -->
  <rect x="60" y="48" width="90" height="26" rx="6" fill="#13103a" stroke="#6366f1" stroke-width="1.2"/>
  <text x="105" y="65" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">CLIENT</text>

  <rect x="710" y="48" width="90" height="26" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.2"/>
  <text x="755" y="65" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">SERVER</text>

  <!-- Lifelines -->
  <line x1="105" y1="74" x2="105" y2="348" stroke="#21262d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="755" y1="74" x2="755" y2="348" stroke="#21262d" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Row helper: y positions 100, 133, 166, 199, 232, 265, 298, 331 -->

  <!-- 1: client → server -->
  <line x1="113" y1="100" x2="747" y2="100" stroke="#6366f1" stroke-width="1.4" marker-end="url(#arrR)"/>
  <rect x="188" y="86" width="484" height="22" rx="5" fill="#13103a"/>
  <text x="430" y="101" text-anchor="middle" fill="#a5b4fc" font-size="10">{ situation, user_id }  or  { mode: "case_study", nodes, caseContext, guidingQuestion }</text>
  <text x="118" y="98" fill="#374151" font-size="9" font-weight="600">1</text>

  <!-- 2: server → client -->
  <line x1="747" y1="133" x2="113" y2="133" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrL)"/>
  <rect x="290" y="120" width="280" height="22" rx="5" fill="#052e16"/>
  <text x="430" y="135" text-anchor="middle" fill="#4ade80" font-size="10">node_selection_start</text>
  <text x="118" y="131" fill="#374151" font-size="9" font-weight="600">2</text>

  <!-- 3: server → client -->
  <line x1="747" y1="166" x2="113" y2="166" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrL)"/>
  <rect x="196" y="153" width="468" height="22" rx="5" fill="#052e16"/>
  <text x="430" y="168" text-anchor="middle" fill="#4ade80" font-size="10">node_selection_complete  →  { nodes: ["finance", "legal", "ethics", ...] }</text>
  <text x="118" y="164" fill="#374151" font-size="9" font-weight="600">3</text>

  <!-- 4: server → client amber -->
  <line x1="747" y1="199" x2="113" y2="199" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrLamber)"/>
  <rect x="290" y="186" width="280" height="22" rx="5" fill="#1a1200"/>
  <text x="430" y="201" text-anchor="middle" fill="#fbbf24" font-size="10">node_start  →  { name: "experts" }</text>
  <text x="118" y="197" fill="#374151" font-size="9" font-weight="600">4</text>

  <!-- 5: server → client blue (×N) -->
  <line x1="747" y1="232" x2="113" y2="232" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrLblue)"/>
  <rect x="148" y="219" width="584" height="22" rx="5" fill="#0a1929"/>
  <text x="440" y="234" text-anchor="middle" fill="#38bdf8" font-size="10">expert_complete  →  { domain, position, key_findings, concerns, confidence }  × N (parallel)</text>
  <text x="118" y="230" fill="#374151" font-size="9" font-weight="600">5</text>

  <!-- 6: server → client amber -->
  <line x1="747" y1="265" x2="113" y2="265" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrLamber)"/>
  <rect x="168" y="252" width="564" height="22" rx="5" fill="#1a1200"/>
  <text x="430" y="267" text-anchor="middle" fill="#fbbf24" font-size="10">node_complete  →  { contradictions[], agreements[], consensus_score: 0.0–1.0 }</text>
  <text x="118" y="263" fill="#374151" font-size="9" font-weight="600">6</text>

  <!-- 7: server → client green -->
  <line x1="747" y1="298" x2="113" y2="298" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrL)"/>
  <rect x="168" y="285" width="564" height="22" rx="5" fill="#052e16"/>
  <text x="430" y="300" text-anchor="middle" fill="#4ade80" font-size="10">node_complete  →  { verdict, reasoning, confidence: high|medium|low, consensus_score }</text>
  <text x="118" y="296" fill="#374151" font-size="9" font-weight="600">7</text>

  <!-- 8: server → client purple -->
  <line x1="747" y1="331" x2="113" y2="331" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrLpurple)"/>
  <rect x="310" y="318" width="240" height="22" rx="5" fill="#1a0a2e"/>
  <text x="430" y="333" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="700">complete  →  { full analysis payload }</text>
  <text x="118" y="329" fill="#374151" font-size="9" font-weight="600">8</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.18"/><stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.07"/>
    </linearGradient>
    <linearGradient id="stdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.18"/><stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.07"/>
    </linearGradient>
    <linearGradient id="csFileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0883e;stop-opacity:0.18"/><stop offset="100%" style="stop-color:#f0883e;stop-opacity:0.07"/>
    </linearGradient>
    <linearGradient id="csNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3b341;stop-opacity:0.18"/><stop offset="100%" style="stop-color:#e3b341;stop-opacity:0.07"/>
    </linearGradient>
    <linearGradient id="expertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.18"/><stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.07"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa657;stop-opacity:0.18"/><stop offset="100%" style="stop-color:#ffa657;stop-opacity:0.07"/>
    </linearGradient>
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149;stop-opacity:0.2"/><stop offset="100%" style="stop-color:#f85149;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="aBlue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#58a6ff" opacity="0.7"/></marker>
    <marker id="aGreen" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#3fb950" opacity="0.7"/></marker>
    <marker id="aOrange" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#f0883e" opacity="0.7"/></marker>
    <marker id="aYellow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#e3b341" opacity="0.7"/></marker>
    <marker id="aPurple" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#a371f7" opacity="0.7"/></marker>
    <marker id="aAmber" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#ffa657" opacity="0.7"/></marker>
    <marker id="aRed" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,1 L0,6 L7,3.5 z" fill="#f85149" opacity="0.7"/></marker>
  </defs>

  <rect width="960" height="620" fill="url(#bg)" rx="14"/>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#21262d" stroke-width="0.4"/>
  </pattern>
  <rect width="960" height="620" fill="url(#grid)" rx="14" opacity="0.55"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="4" font-family="monospace">COGNITUS · ARCHITECTURE</text>

  <!-- Mode labels -->
  <rect x="60" y="52" width="170" height="22" rx="5" fill="#3fb950" opacity="0.1" stroke="#3fb950" stroke-width="1"/>
  <text x="145" y="67" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="700" letter-spacing="1">STANDARD MODE</text>
  <rect x="730" y="52" width="170" height="22" rx="5" fill="#f0883e" opacity="0.1" stroke="#f0883e" stroke-width="1"/>
  <text x="815" y="67" text-anchor="middle" font-size="10" fill="#f0883e" font-weight="700" letter-spacing="1">CASE STUDY MODE</text>

  <!-- USER INPUT -->
  <g filter="url(#sh)">
    <rect x="370" y="66" width="220" height="58" rx="10" fill="url(#userGrad)" stroke="#58a6ff" stroke-width="1.5"/>
  </g>
  <text x="480" y="91" text-anchor="middle" font-size="11" fill="#58a6ff" font-weight="700" letter-spacing="1">USER INPUT</text>
  <text x="480" y="109" text-anchor="middle" font-size="9.5" fill="#58a6ff" opacity="0.65">Question / Files / Custom Nodes</text>

  <!-- Arrow down from user input -->
  <line x1="480" y1="124" x2="480" y2="150" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#aBlue)"/>
  <circle cx="480" cy="155" r="4" fill="#58a6ff" opacity="0.45"/>

  <!-- Fan out to 3 branches -->
  <path d="M 476 155 Q 290 155 145 192" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="4,3" fill="none" opacity="0.55" marker-end="url(#aGreen)"/>
  <line x1="480" y1="159" x2="480" y2="192" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.55" marker-end="url(#aOrange)"/>
  <path d="M 484 155 Q 670 155 815 192" stroke="#e3b341" stroke-width="1.4" stroke-dasharray="4,3" fill="none" opacity="0.55" marker-end="url(#aYellow)"/>

  <!-- STANDARD NODE SELECTOR -->
  <g filter="url(#sh)">
    <rect x="32" y="198" width="226" height="68" rx="10" fill="url(#stdGrad)" stroke="#3fb950" stroke-width="1.4"/>
  </g>
  <text x="145" y="223" text-anchor="middle" font-size="11" fill="#3fb950" font-weight="700" letter-spacing="0.5">STANDARD NODE SELECTOR</text>
  <text x="145" y="240" text-anchor="middle" font-size="9" fill="#3fb950" opacity="0.75">Llama-3.2-1B-Instruct</text>
  <text x="145" y="256" text-anchor="middle" font-size="9" fill="#8b949e">Picks 3–5 expert roles dynamically</text>

  <!-- CASE FILES -->
  <g filter="url(#sh)">
    <rect x="368" y="198" width="224" height="68" rx="10" fill="url(#csFileGrad)" stroke="#f0883e" stroke-width="1.4"/>
  </g>
  <text x="480" y="223" text-anchor="middle" font-size="11" fill="#f0883e" font-weight="700" letter-spacing="0.5">CASE FILES</text>
  <text x="480" y="240" text-anchor="middle" font-size="9" fill="#f0883e" opacity="0.75">PDF · DOCX · PNG · TXT · CSV</text>
  <text x="480" y="256" text-anchor="middle" font-size="9" fill="#8b949e">Extract → Summarize → Inject context</text>

  <!-- CASE STUDY NODE BUILDER -->
  <g filter="url(#sh)">
    <rect x="702" y="198" width="226" height="68" rx="10" fill="url(#csNodeGrad)" stroke="#e3b341" stroke-width="1.4"/>
  </g>
  <text x="815" y="223" text-anchor="middle" font-size="11" fill="#e3b341" font-weight="700" letter-spacing="0.5">NODE BUILDER</text>
  <text x="815" y="240" text-anchor="middle" font-size="9" fill="#e3b341" opacity="0.75">2–6 Custom Expert Nodes</text>
  <text x="815" y="256" text-anchor="middle" font-size="9" fill="#8b949e">Name · Role · Behavior · Color</text>

  <!-- Converge arrows to expert row -->
  <path d="M 145 266 Q 200 305 248 330" stroke="#a371f7" stroke-width="1.4" stroke-dasharray="4,3" fill="none" opacity="0.5" marker-end="url(#aPurple)"/>
  <path d="M 480 266 Q 480 298 480 330" stroke="#a371f7" stroke-width="1.4" stroke-dasharray="4,3" fill="none" opacity="0.5" marker-end="url(#aPurple)"/>
  <path d="M 815 266 Q 760 305 712 330" stroke="#a371f7" stroke-width="1.4" stroke-dasharray="4,3" fill="none" opacity="0.5" marker-end="url(#aPurple)"/>

  <text x="480" y="320" text-anchor="middle" font-size="9" fill="#a371f7" opacity="0.4" font-style="italic">Parallel Execution</text>

  <!-- EXPERT NODES -->
  <g filter="url(#sh)"><rect x="32" y="336" width="170" height="58" rx="9" fill="url(#expertGrad)" stroke="#a371f7" stroke-width="1.2"/></g>
  <text x="117" y="359" text-anchor="middle" font-size="10.5" fill="#d2a8ff" font-weight="700">Expert 1</text>
  <text x="117" y="375" text-anchor="middle" font-size="9" fill="#a371f7" opacity="0.75">Domain Specialist</text>
  <text x="117" y="389" text-anchor="middle" font-size="8" fill="#8b949e">Auto or custom behavior</text>

  <g filter="url(#sh)"><rect x="220" y="336" width="170" height="58" rx="9" fill="url(#expertGrad)" stroke="#a371f7" stroke-width="1.2"/></g>
  <text x="305" y="359" text-anchor="middle" font-size="10.5" fill="#d2a8ff" font-weight="700">Expert 2</text>
  <text x="305" y="375" text-anchor="middle" font-size="9" fill="#a371f7" opacity="0.75">Domain Specialist</text>
  <text x="305" y="389" text-anchor="middle" font-size="8" fill="#8b949e">Auto or custom behavior</text>

  <g filter="url(#sh)"><rect x="395" y="329" width="170" height="72" rx="9" fill="url(#expertGrad)" stroke="#a371f7" stroke-width="1.8"/></g>
  <text x="480" y="354" text-anchor="middle" font-size="10.5" fill="#d2a8ff" font-weight="700">Expert 3</text>
  <text x="480" y="370" text-anchor="middle" font-size="9" fill="#a371f7" opacity="0.75">Domain Specialist</text>
  <text x="480" y="386" text-anchor="middle" font-size="8" fill="#8b949e">Auto or custom behavior</text>

  <g filter="url(#sh)"><rect x="570" y="336" width="170" height="58" rx="9" fill="url(#expertGrad)" stroke="#a371f7" stroke-width="1.2"/></g>
  <text x="655" y="359" text-anchor="middle" font-size="10.5" fill="#d2a8ff" font-weight="700">Expert 4</text>
  <text x="655" y="375" text-anchor="middle" font-size="9" fill="#a371f7" opacity="0.75">Domain Specialist</text>
  <text x="655" y="389" text-anchor="middle" font-size="8" fill="#8b949e">Auto or custom behavior</text>

  <g filter="url(#sh)"><rect x="758" y="336" width="170" height="58" rx="9" fill="url(#expertGrad)" stroke="#a371f7" stroke-width="1.2"/></g>
  <text x="843" y="359" text-anchor="middle" font-size="10.5" fill="#d2a8ff" font-weight="700">Expert N</text>
  <text x="843" y="375" text-anchor="middle" font-size="9" fill="#a371f7" opacity="0.75">Domain Specialist</text>
  <text x="843" y="389" text-anchor="middle" font-size="8" fill="#8b949e">Auto or custom behavior</text>

  <!-- Fan-in to cross-check -->
  <path d="M 117 394 Q 180 440 370 466" stroke="#ffa657" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.45" marker-end="url(#aAmber)"/>
  <path d="M 305 394 Q 360 435 390 466" stroke="#ffa657" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.45" marker-end="url(#aAmber)"/>
  <line x1="480" y1="401" x2="480" y2="466" stroke="#ffa657" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.45" marker-end="url(#aAmber)"/>
  <path d="M 655 394 Q 600 435 570 466" stroke="#ffa657" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.45" marker-end="url(#aAmber)"/>
  <path d="M 843 394 Q 780 440 590 466" stroke="#ffa657" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.45" marker-end="url(#aAmber)"/>

  <!-- CROSS-CHECK -->
  <g filter="url(#sh)">
    <rect x="290" y="472" width="380" height="60" rx="10" fill="url(#crossGrad)" stroke="#ffa657" stroke-width="1.5"/>
  </g>
  <text x="480" y="496" text-anchor="middle" font-size="11" fill="#ffa657" font-weight="700" letter-spacing="1">CROSS-CHECK COORDINATOR</text>
  <text x="480" y="513" text-anchor="middle" font-size="9.5" fill="#ffa657" opacity="0.75">Surfaces contradictions &amp; agreements</text>
  <text x="480" y="527" text-anchor="middle" font-size="9" fill="#8b949e">across all expert outputs</text>

  <!-- Arrow to synthesizer -->
  <line x1="480" y1="532" x2="480" y2="558" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#aRed)"/>

  <!-- SYNTHESIZER -->
  <g filter="url(#sh)">
    <rect x="290" y="564" width="380" height="44" rx="10" fill="url(#synthGrad)" stroke="#f85149" stroke-width="1.5"/>
  </g>
  <text x="480" y="583" text-anchor="middle" font-size="11" fill="#f85149" font-weight="700" letter-spacing="1">SYNTHESIZER · FINAL VERDICT</text>
  <text x="480" y="599" text-anchor="middle" font-size="9.5" fill="#f85149" opacity="0.7">Confidence · Consensus · Recommendations</text>

  <!-- Legend -->
  <rect x="32" y="592" width="10" height="10" rx="2" fill="#3fb950" opacity="0.7"/>
  <text x="48" y="601" font-size="9" fill="#8b949e">Standard Mode</text>
  <rect x="148" y="592" width="10" height="10" rx="2" fill="#f0883e" opacity="0.7"/>
  <text x="164" y="601" font-size="9" fill="#8b949e">Case Study Mode</text>
  <rect x="264" y="592" width="10" height="10" rx="2" fill="#a371f7" opacity="0.7"/>
  <text x="280" y="601" font-size="9" fill="#8b949e">Shared Pipeline</text>
</svg>